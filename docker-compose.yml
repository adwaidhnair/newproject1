services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_intel
      POSTGRES_USER: erp_intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_intel -d erp_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://erp_intel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}@db:5432/erp_intel
      ERP_API_KEY: ${ERP_API_KEY:?Set ERP_API_KEY to a long random secret}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the deployed frontend origin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
